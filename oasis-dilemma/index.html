<body>
<div id="app"></div>
<div id="modal"></div>
<script>
/* The Oasis Dilemma: simulation engine (pure functions, no DOM).
   Core mechanism follows Hemenway Falk and Tsoukalas (2026), "The AI Layoff Trap", arXiv:2603.20617:
   each firm keeps its full saving from automation but bears only its market share of the
   household demand it destroys. Level 1 reproduces the paper's prisoner's dilemma exactly. */
(function (root) {
  'use strict';

  var BASE = {
    wage: 10,            // coins per person per round
    lambda: 0.8,         // share of household income spent in Oasis City shops
    visitorPerFirm: 60,  // visitor and export demand per original company per round
    startCash: 100,
    startTrust: 60,
    sosoCost: 7,         // so-so AI: saves only 3, no integration cost, no ramp up
    sosoOut: 0.9,
    augCopilot: 2,       // AI copilot cost per augmented role per round
    augTrain: 3,         // one time training per new augmented role
    augRevenue: 6,       // better service and upselling per augmented role per round (own revenue)
    ventureReskill: 8,   // one time reskilling per person moved to a new venture
    ventureRamp: [0, 10, 14, 18], // venture revenue per person by venture age (rounds)
    ventureCapShare: 0.4,
    rehire: 4,           // one time cost to bring a role back from AI
    friction: 0.5,       // integration cost = friction x (new standard AI roles)^2
    retrainCost: 25,     // coins to retrain and re-employ one displaced person
    mergerFee: 15,
    charterMonitor: 2,
    valueMultiple: 6,
    ventureMultiple: 3
  };

  var LEVELS = {
    1: { key: 1, name: 'The Robot Arrives', rounds: 2, aiCost: [4, 4], aiOut: [1, 1], friction: false, jcurve: false,
         price: false, workforce: false, trustOnShare: false, events: false, council: false, soso: false, entrant: [] },
    2: { key: 2, name: 'The Race', rounds: 3, maxRounds: 4, aiCost: [4, 3, 2, 2], aiOut: [1.3, 1.5, 1.7, 1.8], friction: true, jcurve: true,
         price: true, workforce: false, trustOnShare: false, events: false, council: false, soso: true, entrant: [] },
    3: { key: 3, name: 'The Human Edge', rounds: 3, aiCost: [2, 2, 2], aiOut: [1.8, 1.9, 2.0], friction: true, jcurve: true,
         price: true, workforce: true, trustOnShare: true, events: true, council: false, soso: true, entrant: [0.5, 0.8, 1.0] },
    4: { key: 4, name: 'The Town Hall', rounds: 2, maxRounds: 3, aiCost: [2, 1, 1], aiOut: [2.0, 2.1, 2.2], friction: true, jcurve: true,
         price: true, workforce: true, trustOnShare: true, events: true, council: true, soso: true, entrant: [1.0, 1.1, 1.2] }
  };

  var PRICE = {
    value:    { label: 'Value',    attract: 1.3,  margin: -0.10 },
    standard: { label: 'Standard', attract: 1.0,  margin: 0 },
    premium:  { label: 'Premium',  attract: 0.75, margin: 0.08 }
  };

  var EVENTS = [
    { id: 'boom',      title: 'Export boom',        text: 'A new air route brings more visitors. Visitor demand is 25% higher this round.' },
    { id: 'slowdown',  title: 'Global slowdown',    text: 'Fewer visitors this round. Visitor demand is 20% lower.' },
    { id: 'outage',    title: 'AI outage',          text: 'A major AI provider goes down. Every AI agent produces half its output this round. Augmented roles keep working.' },
    { id: 'viral',     title: 'Viral praise',       text: 'A post about the company that invested most in its people goes viral. Its trust rises by 10.' },
    { id: 'incident',  title: 'Data incident',      text: 'The company with the most AI agents suffers a data incident. Trust falls by 12 and clean up costs 10 coins.' },
    { id: 'pricedrop', title: 'AI price drop',      text: 'A new model launches. AI agents cost 1 coin less this round.' },
    { id: 'backlash',  title: 'Customer backlash',  text: 'Local customers notice the empty counters. Any company that automated 3 or more roles this round loses 6 trust.' },
    { id: 'skills',    title: 'Skills shortage',    text: 'Trainers are fully booked. Training for new augmented roles costs double this round.' }
  ];

  function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
  function r1(x) { return Math.round(x * 10) / 10; }

  // Seeded RNG so a session can be replayed
  function rng(seed) {
    var s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0;
      var t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function param(arr, i) { return arr[Math.min(i, arr.length - 1)]; }

  function newFirm(id, name, L) {
    return {
      id: id, name: name, L: L || 10, active: true, mergedInto: null,
      human: L || 10, ai: 0, soso: 0, aug: 0, venture: 0,
      ventureCohorts: [], // [{n, age}]
      cash: BASE.startCash, trust: BASE.startTrust,
      charter: false, history: []
    };
  }

  function newGame(opts) {
    opts = opts || {};
    var n = clamp(opts.teams || 4, 2, 8);
    var names = opts.names || [];
    var firms = [];
    for (var i = 0; i < n; i++) firms.push(newFirm(i, names[i] || ('Team ' + (i + 1)), 10));
    return {
      version: 1,
      seed: opts.seed || 20261116,
      settings: {
        edition: opts.edition || 'company',      // company | government | mixed | lite
        councilMode: opts.councilMode || 'facilitator',
        modules: { merger: true, entrant: true, soso: true, failures: true },
        floor: opts.floor || 60,
        currency: opts.currency || 'coins',
        hints: true
      },
      N0: n,
      firms: firms,
      level: 1, round: 0,          // round index within level (0 based) of the NEXT round to play
      council: { levy: 0, retrain: 60, support: 30, rebate: 10, charterCap: 60, charterPenalty: 10, mandatory: false },
      town: { reemployed: 0, retrainFund: 0, entrantRevenue: 0 },
      log: [],                      // one entry per played round
      pendingEvent: null
    };
  }

  function levelCfg(game) {
    var cfg = JSON.parse(JSON.stringify(LEVELS[game.level]));
    if (game.settings.edition === 'lite') {
      cfg.price = false; cfg.soso = false; cfg.events = false;
      if (cfg.key === 2) { cfg.rounds = 2; cfg.maxRounds = 3; }
      if (cfg.key === 3) cfg.rounds = 2;
      if (cfg.key === 4) { cfg.rounds = 1; cfg.maxRounds = 2; }
    }
    if (!game.settings.modules.soso) cfg.soso = false;
    if (!game.settings.modules.entrant) cfg.entrant = [];
    return cfg;
  }

  function activeFirms(game) { return game.firms.filter(function (f) { return f.active; }); }

  // Default decision = keep current workforce
  function defaultDecision(f) {
    return { ai: f.ai, soso: f.soso, aug: f.aug, venture: f.venture, price: 'standard', charter: f.charter };
  }

  // Validate and normalise a decision for a firm in the current level
  function normalise(game, f, d) {
    var cfg = levelCfg(game);
    var L = f.L;
    var out = {
      ai: clamp(Math.round(+d.ai || 0), 0, L),
      soso: cfg.soso ? clamp(Math.round(+d.soso || 0), 0, L) : 0,
      aug: cfg.workforce ? clamp(Math.round(+d.aug || 0), 0, L) : 0,
      venture: cfg.workforce ? clamp(Math.round(+d.venture || 0), 0, Math.floor(L * BASE.ventureCapShare)) : 0,
      price: cfg.price && PRICE[d.price] ? d.price : 'standard',
      charter: cfg.council ? !!d.charter : false
    };
    if (!cfg.soso) { out.ai = clamp(out.ai + 0, 0, L); }
    // In Levels 1 and 2 existing so-so roles remain unless changed
    var used = out.ai + out.soso + out.aug + out.venture;
    if (used > L) {
      // trim in order: venture, aug, soso, ai
      var over = used - L;
      ['venture', 'aug', 'soso', 'ai'].forEach(function (k) {
        var t = Math.min(over, out[k]); out[k] -= t; over -= t;
      });
    }
    out.human = L - out.ai - out.soso - out.aug - out.venture;
    return out;
  }

  // Bot decision (Government edition, Level 4): rational short run best response
  function botDecision(game, f, cfg) {
    var i = game.round;
    var c = param(cfg.aiCost, i);
    var N = activeFirms(game).length;
    var eta = currentEta(game);
    var l = BASE.lambda * (1 - eta) * BASE.wage;
    var tau = game.council.levy;
    var marginal = (BASE.wage - c) - l / N - tau;
    var d = defaultDecision(f);
    var inCharter = game.council.mandatory || f.charter;
    var cap = Math.floor(f.L * game.council.charterCap / 100);
    var target = f.ai + f.soso;
    if (marginal > 0) target = Math.min(f.L - f.venture - f.aug, target + 3);
    else if (marginal < -2) target = Math.max(0, target - 2);
    if (inCharter && marginal <= game.council.charterPenalty) target = Math.min(target, cap);
    d.soso = Math.min(f.soso, target);
    d.ai = target - d.soso;
    d.charter = inCharter;
    return d;
  }

  function currentEta(game) {
    // income replaced for displaced households, from the last round played
    var last = game.log[game.log.length - 1];
    return last ? last.town.eta : 0;
  }

  function trustFactor(t) { return 0.6 + 0.8 * clamp(t, 0, 100) / 100; }

  // Play one round. decisions: {firmId: decision}. eventId optional.
  function playRound(game, decisions, eventId) {
    var g = JSON.parse(JSON.stringify(game));
    var cfg = levelCfg(g);
    var i = g.round;
    var R = rng(g.seed + g.log.length * 7919);
    var firms = activeFirms(g);
    var N = firms.length;
    var W = BASE.wage;
    var aiCost = param(cfg.aiCost, i);
    var aiOut = param(cfg.aiOut, i);
    var augOut = 1 + 0.65 * aiOut;
    var ev = eventId ? EVENTS.filter(function (e) { return e.id === eventId; })[0] : null;
    if (ev && ev.id === 'pricedrop') aiCost = Math.max(1, aiCost - 1);
    var augTrain = BASE.augTrain * (ev && ev.id === 'skills' ? 2 : 1);
    var govBots = g.settings.edition === 'government' && cfg.council;

    var rows = [];
    firms.forEach(function (f) {
      var raw = govBots ? botDecision(g, f, cfg) : (decisions && decisions[f.id]) || defaultDecision(f);
      if (cfg.council && g.council.mandatory) raw.charter = true;
      var d = normalise(g, f, raw);
      var prevAI = f.ai, prevSoso = f.soso, prevAug = f.aug, prevVen = f.venture;
      var newAI = Math.max(0, d.ai - prevAI);
      var newSoso = Math.max(0, d.soso - prevSoso);
      var autoTotalPrev = prevAI + prevSoso, autoTotal = d.ai + d.soso;
      var rehired = Math.max(0, autoTotalPrev - autoTotal);
      var newAug = Math.max(0, d.aug - prevAug);
      var newVen = Math.max(0, d.venture - prevVen);
      // venture cohorts
      var cohorts = f.ventureCohorts.map(function (c) { return { n: c.n, age: c.age + 1 }; });
      if (d.venture < prevVen) {
        var cut = prevVen - d.venture;
        for (var k = cohorts.length - 1; k >= 0 && cut > 0; k--) {
          var t = Math.min(cut, cohorts[k].n); cohorts[k].n -= t; cut -= t;
        }

      svg += '<path d="M' + tx + ' ' + ty + ' q ' + (l[0] * 0.5 * s) + ' ' + ((l[1] - 12) * s) + ' ' + (l[0] * s) + ' ' + ((l[1] + droop + 22) * s) + '" stroke="' + (j % 2 ? leaf : leaf2) + '" stroke-width="' + (9 * s) + '" fill="none" stroke-linecap="round" style="transition:stroke 1s"/>';

  });

  var loopRx = pondRx + 95, loopRy = pondRy + 70;
  var loopPath = 'M ' + (cx - loopRx) + ' ' + cy + ' a ' + loopRx + ' ' + loopRy + ' 0 1 0 ' + (2 * loopRx) + ' 0 a ' + loopRx + ' ' + loopRy + ' 0 1 0 ' + (-2 * loopRx) + ' 0';

      svg += '<text x="30" y="83" text-anchor="middle" font-size="10" fill="#5d6d75" stroke="#fff" stroke-width="3" paint-order="stroke">' + people + ' people &middot; ' + bots + ' AI</text>';
      if (bots > 0) svg += robotIcon(44, -14, 14, '#5d6d75');

/* ---------- charts ---------- */
function lineChart(series, opts) {
  opts = opts || {};
  var W = 560, H = 220, P = { l: 44, r: 12, t: 12, b: 28 };
  var all = []; series.forEach(function (s) { all = all.concat(s.values.filter(function (v) { return v != null; })); });
  if (opts.floor != null) all.push(opts.floor);
  if (!all.length) return '<div class="small">No data yet.</div>';
  var min = Math.min(0, Math.min.apply(null, all)), max = Math.max.apply(null, all) * 1.08 || 1;
  var n = Math.max.apply(null, series.map(function (s) { return s.values.length; }));
  function X(i) { return P.l + (n <= 1 ? (W - P.l - P.r) / 2 : i * (W - P.l - P.r) / (n - 1)); }
  function Y(v) { return H - P.b - (v - min) / (max - min) * (H - P.t - P.b); }
  var svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '">';
  for (var t = 0; t <= 4; t++) { var v = min + (max - min) * t / 4; svg += '<line x1="' + P.l + '" x2="' + (W - P.r) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="#e6edf0"/><text x="' + (P.l - 6) + '" y="' + (Y(v) + 4) + '" font-size="10" text-anchor="end" fill="#5d6d75">' + fmt(v) + '</text>'; }
  if (min < 0) svg += '<line x1="' + P.l + '" x2="' + (W - P.r) + '" y1="' + Y(0) + '" y2="' + Y(0) + '" stroke="#9aa"/>';
  if (opts.floor != null) svg += '<line x1="' + P.l + '" x2="' + (W - P.r) + '" y1="' + Y(opts.floor) + '" y2="' + Y(opts.floor) + '" stroke="#c8414f" stroke-dasharray="5 4"/><text x="' + (W - P.r) + '" y="' + (Y(opts.floor) - 4) + '" font-size="10" text-anchor="end" fill="#c8414f">floor</text>';
  (opts.labels || []).forEach(function (lb, i) { if (n <= 12 || i % 2 === 0) svg += '<text x="' + X(i) + '" y="' + (H - 8) + '" font-size="10" text-anchor="middle" fill="#5d6d75">' + esc(lb) + '</text>'; });
  series.forEach(function (s) {
    var pts = s.values.map(function (v, i) { return v == null ? null : X(i) + ',' + Y(v); }).filter(Boolean);
    if (pts.length > 1) svg += '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + s.color + '" stroke-width="' + (s.width || 2.5) + '" stroke-linejoin="round"/>';
    s.values.forEach(function (v, i) { if (v != null) svg += '<circle cx="' + X(i) + '" cy="' + Y(v) + '" r="3" fill="' + s.color + '"/>'; });
  });
  svg += '</svg>';
  if (opts.legend) svg += '<div class="legend">' + series.map(function (s) { return '<span><i style="background:' + s.color + '"></i>' + esc(s.name) + '</span>'; }).join('') + '</div>';
  return svg;
}
function roundLabels(g, start) { var l = g.log.filter(function (e) { return !e.merger; }).map(function (e) { return 'L' + e.level + 'R' + e.round; }); return start ? ['Start'].concat(l) : l; }
function townSeries(g, key) { var base = { householdIncome: g.N0 * 100, tpi: 100, totalProfit: g.N0 * 40 }[key]; return [base].concat(g.log.filter(function (e) { return !e.merger; }).map(function (e) { return e.town[key]; })); }
function firmSeries(g, key) {
  var entries = g.log.filter(function (e) { return !e.merger; });
  return g.firms.map(function (f) {
    var vals = entries.map(function (e) { var h = f.history.filter(function (x) { return x.level === e.level && x.round === e.round; })[0]; return h ? h[key] : null; });

  h += '<div class="formrow"><label>Town Charter: AI cap</label><input type="range" min="0" max="100" step="10" value="' + k.charterCap + '" data-c="charterCap"><b>' + k.charterCap + '%</b> of roles</div>';
  h += '<div class="formrow"><label>Penalty per role over cap</label><input type="range" min="0" max="20" step="1" value="' + k.charterPenalty + '" data-c="charterPenalty"><b>' + k.charterPenalty + '</b> <span class="small">to retraining</span></div>';
  h += '<div class="formrow"><label>Charter is mandatory</label><input type="checkbox" data-c="mandatory"' + (k.mandatory ? ' checked' : '') + '><span class="small">Turns the voluntary pact into a town rule.</span></div>';
  if (g.settings.hints) h += '<div class="banner" style="margin-top:8px"><b>Facilitator lens.</b> With ' + N + ' companies and income replacement at ' + pct(eta) + ', each AI agent drains about ' + fmt(ell, 1) + ' ' + cur() + ' of household spending. The research model\'s corrective levy is ' + fmt(ell, 1) + ' &times; (1 &minus; 1/' + N + ') = <b>' + fmt(tau, 1) + '</b>. Retraining raises income replacement, which lowers the levy needed. <button class="btn small ghost" data-a="hidehints">Hide</button></div>';
  h += '</div>';
  return h;
}

function stepper(fid, key, val, max) {
  return '<div class="step"><button data-a="dec" data-f="' + fid + '" data-k="' + key + '" data-d="-1" aria-label="minus">&minus;</button><span class="n">' + val + '</span><button data-a="dec" data-f="' + fid + '" data-k="' + key + '" data-d="1" aria-label="plus">+</button></div>';
}

function renderDecisions() {
  var g = S.game, c = cfg();
  var done = roundComplete(), maxed = E.levelDone(g);
  var h = '<div class="card"><h2>' + (done ? 'Level ' + g.level + ' complete' : 'Decisions for round ' + (g.round + 1)) + '</h2>';
  if (done) {
    h += '<div class="sub">Run the debrief, then move on.' + (!maxed ? ' This level allows one more round if the room needs it.' : '') + '</div><div class="actions">';
    h += '<button class="btn gold" data-a="debrief">Open the Level ' + g.level + ' debrief</button>';
    if (!maxed) h += '<button class="btn ghost" data-a="extraround">Play one more round</button>';
    h += g.level < 4 ? '<button class="btn primary" data-a="nextlevel">Start Level ' + (g.level + 1) + '</button>' : '<button class="btn primary" data-a="final">Final results</button>';
    h += '</div></div>';
    return h;
  }
  if (govBots()) {
    h += '<div class="sub">Government Edition: bot companies choose their workforce the way a rational firm would, given your policy. Set the policy above, then play the round.</div>';
  } else {
    h += '<div class="sub">Teams decide on paper. Enter each team\'s card, then lock it. Locked decisions are hidden until the reveal.' + (g.level === 2 ? ' Run the Handshake Minute before teams write their cards.' : '') + '</div>';
    h += '<div class="teams">';
    E.activeFirms(g).forEach(function (f) {
      var d = S.dec[f.id]; if (!d) return;
      var col = COLORS[f.id % COLORS.length];
      h += '<div class="team' + (d.locked ? ' locked' : '') + '"><h3><span class="dot" style="background:' + col + '"></span>' + esc(f.name) + '</h3>';
      if (d.locked) {
        h += '<div class="lockbox">Locked &#10003;</div><button class="btn small ghost" data-a="unlock" data-f="' + f.id + '">Edit</button>';
      } else {
        h += '<div class="field"><label>AI agents</label>' + stepper(f.id, 'ai', d.ai) + '</div>';
        if (c.soso) h += '<div class="field"><label>So-so AI</label>' + stepper(f.id, 'soso', d.soso) + '</div>';
        if (c.workforce) {
          h += '<div class="field"><label>Augmented</label>' + stepper(f.id, 'aug', d.aug) + '</div>';
          h += '<div class="field"><label>New Venture <span class="small">(max ' + Math.floor(f.L * 0.4) + ')</span></label>' + stepper(f.id, 'venture', d.venture) + '</div>';
        }
        var human = f.L - used(d);
        h += '<div class="field"><label>People in core roles</label><b>' + human + '</b></div>';
        if (c.price) h += '<div class="field"><label>Price</label><div class="seg">' + ['value', 'standard', 'premium'].map(function (p) { return '<button data-a="price" data-f="' + f.id + '" data-p="' + p + '" class="' + (d.price === p ? 'on' : '') + '">' + E.PRICE[p].label + '</button>'; }).join('') + '</div></div>';
        if (c.council && !g.council.mandatory) h += '<div class="field"><label>Sign the Town Charter</label><input type="checkbox" data-a="charter" data-f="' + f.id + '"' + (d.charter ? ' checked' : '') + '></div>';
        h += '<div class="note">' + previewNote(f, d, c) + '</div>';
        h += '<div class="actions" style="margin-top:8px"><button class="btn small primary" data-a="lock" data-f="' + f.id + '">Lock</button></div>';
      }
      h += '</div>';
    });
    h += '</div>';
  }
  var allLocked = govBots() || E.activeFirms(g).every(function (f) { return S.dec[f.id] && S.dec[f.id].locked; });
  h += '<div class="actions">';
  h += '<button class="btn gold" data-a="reveal"' + (allLocked ? '' : ' disabled') + '>Reveal results</button>';
  if (!allLocked) h += '<button class="btn ghost" data-a="lockall">Lock all</button>';
  if (c.events && !g.pendingEvent) h += '<button class="btn ghost" data-a="event">Draw an event card</button>';
  if (g.settings.modules.merger && g.level >= 2 && E.activeFirms(g).length > 2 && !govBots()) h += '<button class="btn ghost" data-a="merge">Merger card</button>';
  h += '<button class="btn ghost" data-a="intro">Show level briefing</button>';
  if (g.round >= 1) h += '<button class="btn ghost" data-a="endnow">End this level now</button>';
  h += '</div></div>';
  return h;
}

function previewNote(f, d, c) {
  var parts = [];
  var newAI = Math.max(0, d.ai - f.ai);
  if (c.friction && newAI > 0) parts.push('Integration cost ' + fmt(0.5 * newAI * newAI) + ' ' + cur());
  var back = Math.max(0, (f.ai + f.soso) - (d.ai + d.soso)); if (back) parts.push('Rehire ' + back + ' (' + back * 4 + ' ' + cur() + ')');
  var na = Math.max(0, d.aug - f.aug); if (na) parts.push('Train ' + na + ' augmented (' + na * 3 + ')');
  var nv = Math.max(0, d.venture - f.venture); if (nv) parts.push('Reskill ' + nv + ' for ventures (' + nv * 8 + ')');
  return parts.length ? parts.join(' &middot; ') : 'No one time costs this round.';
}

/* ---------- modals ---------- */
function open(m) { S.modal = m; renderModal(); }
function close() { S.modal = null; renderModal(); }
function renderModal() {
  var m = S.modal, box = $('modal');
  if (!m) { box.innerHTML = ''; return; }
  var inner = '';
  if (m.type === 'intro') inner = introModal();
  else if (m.type === 'reveal') inner = revealModal();
  else if (m.type === 'debrief') inner = debriefModal();
  else if (m.type === 'event') inner = eventModal(m);
  else if (m.type === 'settings') inner = settingsModal();
  else if (m.type === 'guide') inner = guideModal();
  else if (m.type === 'kit') inner = kitModal();
  else if (m.type === 'merge') inner = mergeModal();
  else if (m.type === 'confirm') inner = '<h2>' + esc(m.title) + '</h2><p>' + esc(m.text) + '</p><div class="actions"><button class="btn primary" data-a="' + m.yes + '">' + esc(m.yesLabel || 'Yes') + '</button><button class="btn ghost" data-a="close">Cancel</button></div>';
  box.innerHTML = '<div class="modal-bg" data-a="bgclose"><div class="modal" data-stop="1">' + inner + '</div></div>';
}

function introModal() {
  var g = S.game, L = g.level, info = LEVEL_INFO[L], c = cfg();

}

function revealModal() {
  var g = S.game, last = E.lastRoundEntry(g), entries = g.log.filter(function (e) { return !e.merger; }), prev = entries.length > 1 ? entries[entries.length - 2] : null;
  var h = '<div class="kicker">Level ' + last.level + ' &middot; Round ' + last.round + ' revealed</div><h1>The reveal</h1>';
  if (last.event) { var ev = E.EVENTS.filter(function (e) { return e.id === last.event; })[0]; h += '<div class="banner"><b>Event: ' + esc(ev.title) + '.</b> ' + esc(C(ev.text)) + '</div>'; }
  E.activeFirms(g).forEach(function (f, i) {
    var hh = f.history[f.history.length - 1]; if (!hh) return;
    var icons = '';
    for (var k = 0; k < hh.human; k++) icons += '<svg class="ic" viewBox="0 0 16 16">' + personIcon(0, 0, 16, COLORS[f.id % COLORS.length]) + '</svg>';
    for (k = 0; k < hh.aug; k++) icons += '<svg class="ic" viewBox="0 0 16 16">' + personIcon(0, 0, 16, '#F4B223') + '</svg>';

    h += '<div class="reveal-row" style="animation-delay:' + (i * 0.45) + 's"><div><span class="dot" style="background:' + COLORS[f.id % COLORS.length] + '"></span><b>' + esc(f.name) + '</b><div class="small">' + (hh.newAI ? hh.newAI + ' new AI agents' : 'No new AI agents') + (hh.price !== 'standard' && cfg().price ? ' &middot; ' + E.PRICE[hh.price].label + ' price' : '') + (hh.charter ? ' &middot; Charter' : '') + (hh.failure ? ' &middot; <span class="down">AI failure</span>' : '') + (hh.eventNote ? ' &middot; ' + esc(hh.eventNote) : '') + '</div></div><div class="icons">' + icons + '</div><div><div class="small">Profit</div><b style="font-size:20px">' + fmt(hh.profit) + '</b>' + (ph != null ? ' <span class="' + (hh.profit >= ph ? 'up' : 'down') + '">' + sign(hh.profit - ph) + '</span>' : '') + '</div><div><div class="small">Value</div><b style="font-size:20px">' + fmt(hh.value) + '</b></div></div>';
  });

  if (prev) { var d = t.householdIncome - prev.town.householdIncome; if (Math.abs(d) > 0.5) line += ' It ' + (d < 0 ? 'fell' : 'rose') + ' by ' + fmt(Math.abs(d)) + ' this round.'; }
  h += '<div class="insight" style="animation:fadein .6s ' + (E.activeFirms(g).length * 0.45) + 's both">' + line + ' Town Prosperity: <b>' + fmt(t.tpi) + '</b>' + (t.tpi < g.settings.floor ? ', below the floor of ' + g.settings.floor + '.' : '.') + '</div>';
  h += '<div class="actions"><button class="btn primary" data-a="close">Back to the town</button>' + (roundComplete() ? '<button class="btn gold" data-a="debrief">Open the debrief</button>' : '') + '</div>';
  return h;
}

function debriefModal() {
  var g = S.game, L = g.level, info = LEVEL_INFO[L];
  var lv = g.log.filter(function (e) { return !e.merger && e.level === L; });
  var before = g.log.filter(function (e) { return !e.merger && e.level < L; });
  var startT = before.length ? before[before.length - 1].town : { householdIncome: g.N0 * 100, employment: g.N0 * 10, automated: 0, totalProfit: g.N0 * 40, tpi: 100 };
  var endT = lv.length ? lv[lv.length - 1].town : startT;
  var h = '<div class="kicker">Debrief &middot; Level ' + L + '</div><h1>' + esc(E.LEVELS[L].name) + '</h1>';
  h += '<div class="insight">' + C(info.insight) + '</div>';
  h += '<h2>What happened this level</h2><div class="stats">';
  [['Household income', 'householdIncome'], ['People employed', 'employment'], ['AI agents', 'automated'], ['Town Prosperity', 'tpi']].forEach(function (x) {
    var a = startT[x[1]], b = endT[x[1]];
    h += '<div class="stat"><div class="k">' + x[0] + '</div><div class="v">' + fmt(b) + '</div><div class="d">from ' + fmt(a) + '</div></div>';
  });
  h += '</div>';
  if (L === 1) {
    var N = E.activeFirms(g).length, pm = E.payoffMatrix(N);
    h += '<h2>The dilemma in one table</h2><p class="small">Profit per round for one company, if it replaces all 10 people or none, depending on what the other ' + (N - 1) + ' companies do.</p>';
    h += '<table class="matrix"><tr><th></th><th>Others hold</th><th>Others automate all</th></tr><tr><th>You hold</th><td>' + pm.bothHold + '</td><td>' + pm.othersAuto + '</td></tr><tr><th>You automate all</th><td class="hl">' + pm.meAuto + '</td><td class="hl">' + pm.allAuto + '</td></tr></table>';
    h += '<p>Whatever the others do, automating pays you more. So everyone automates, and everyone ends up with ' + pm.allAuto + ' instead of ' + pm.bothHold + '. Per job: you save <b>' + pm.perJob.save + '</b>, you lose <b>' + pm.perJob.cost + '</b> in sales, and the town loses <b>' + pm.perJob.town + '</b> overall.</p>';
  } else if (lv.length) {
    var p = lv[lv.length - 1].paper;
    h += '<h2>The trap in numbers (last round)</h2><p>Each AI agent saved its company <b>' + fmt(p.s, 1) + '</b> ' + cur() + ' and drained about <b>' + fmt(p.ell, 1) + '</b> from household spending. The company itself felt only part of that. Private gain per agent: <b>' + fmt(p.privateNet, 1) + '</b>. Gain for the whole town: <b>' + fmt(p.socialNet, 1) + '</b>.' + (p.socialNet > 0.05 ? ' AI is now cheap enough that automating creates value for the town too. The question is how fast, and what happens to the people.' : p.socialNet >= -0.05 ? ' AI now breaks even for the town: each agent saves about as much as it drains. The question is how fast, and what happens to the people.' : ' Each agent still makes the town poorer.') + '</p>';
  }
  if (g.log.filter(function (e) { return !e.merger; }).length > 1) {
    h += '<div class="cols"><div><h2>Town</h2>' + lineChart([
      { name: 'Household income', color: '#2b9fc4', values: townSeries(g, 'householdIncome') },
      { name: 'Town Prosperity', color: '#006580', values: townSeries(g, 'tpi') }], { labels: roundLabels(g, true), legend: true, floor: g.settings.floor }) + '</div>';
    h += '<div><h2>Profit by company</h2>' + lineChart(firmSeries(g, 'profit'), { labels: roundLabels(g), legend: true }) + '</div></div>';
  }
  h += '<h2>Debrief questions</h2><ol>' + info.questions.map(function (q) { return '<li>' + esc(q) + '</li>'; }).join('') + '</ol>';
  h += '<p class="small">Debrief cycle: What happened? Why? So what for your organization? Now what?</p>';
  h += '<div class="actions">' + (L < 4 ? '<button class="btn primary" data-a="nextlevel">Start Level ' + (L + 1) + '</button>' : '<button class="btn primary" data-a="final">Final results</button>') + '<button class="btn ghost" data-a="close">Close</button></div>';
  return h;
}

    '<h3>Level 2: The Race</h3><p><b>Land this:</b> competition and better AI made the race faster; market share gains cancelled out. Watch for broken promises and ask why they broke. As AI got cheaper, automation started to create value even for the town, so the issue is pace and how far.</p><p><b>Say:</b> "What would it take for a promise to hold?"</p>' +
    '<h3>Level 3: The Human Edge</h3><p><b>Land this:</b> augmenting people and building new ventures keep wages in town and build trust, but they cost cash now. The zero payroll rival shows that the threat is not only your neighbor.</p><p><b>Say:</b> "Which of your real roles would you Keep, Automate, Augment or Redeploy?"</p>' +
    '<h3>Level 4: The Town Hall</h3><p><b>Land this:</b> some problems are adaptive: no single company can fix them. Rules change the game. In the research model, only a levy equal to the damage each agent does to rivals fully fixes the trap. Retraining is the best use of the money because it lowers the damage itself.</p><p><b>Say:</b> "What rule would you want, even if it costs you?"</p>',
  facts: '<h3>The research behind the game</h3><ul>' +
    '<li><b>The core model.</b> Hemenway Falk, B. and Tsoukalas, G. (2026). The AI Layoff Trap. arXiv preprint 2603.20617 (University of Pennsylvania and Boston University). A simplified, not yet peer reviewed model: each firm keeps its full saving from automation but feels only its share of the demand it destroys. Only a levy set at the damage to rivals fully corrects it; retraining narrows the gap. <a href="https://arxiv.org/abs/2603.20617">arxiv.org/abs/2603.20617</a></li>' +
    '<li><b>New work.</b> Autor, Chin, Salomons and Seegmiller (Quarterly Journal of Economics, 2024): about 60% of US jobs in 2018 were in job types that did not exist in 1940. <a href="https://news.mit.edu/2024/does-technology-help-or-hurt-employment-0401">MIT News</a></li>' +
    '<li><b>The Henry Ford story.</b> If someone says "Ford paid $5 a day so workers could buy his cars": Raff and Summers (Journal of Labor Economics, 1987) found the $5 day is best explained by labor problems such as very high turnover. One firm cannot profit by paying its workers to buy its products, because it gets back only a fraction. That is this game\'s trap in reverse. <a href="https://www.nber.org/papers/w2101">NBER w2101</a></li>' +
    '<li><b>Ideas behind the mechanics.</b> Brynjolfsson, The Turing Trap (2022): augmentation vs automation. Brynjolfsson, Rock and Syverson: the productivity J curve. Acemoglu and Restrepo: so-so automation. Axelrod, The Evolution of Cooperation: the shadow of the future. Ostrom, Governing the Commons: monitoring and penalties. Pigou: tax the damage. Drucker: the purpose of a business is to create a customer.</li></ul>' +
    '<h3>Numbers in the game</h3><ul><li>Wage 10 per person per round. Households spend 8 of 10 in town. Visitors bring 60 per company.</li><li>AI agent cost: 4 (Level 1), then 4, 3, 2 (Level 2), 2 (Level 3), 2 then 1 (Level 4).</li><li>Integration cost: 0.5 &times; (new agents)&sup2;. New agents run at half output in their first round.</li><li>So-so AI: costs 7, output 0.9, no integration cost.</li><li>Augmented role: wage plus 2 copilot, 3 to train, about 2.2 times a person\'s output, plus 6 service revenue.</li><li>New Venture: 8 to reskill, then 10, 14, 18 per person per round.</li><li>Company value: 6 &times; average profit of the last two rounds &times; a trust factor, plus 3 &times; venture revenue, plus cash.</li><li>Town Prosperity: 50% household income, 30% employment, 20% total profit, against the start (100).</li></ul>',
  faq: '<h3>Is this real?</h3><p>It is a teaching model built on a 2026 economic paper. It shows a mechanism, not a forecast. The authors note we are not yet seeing it clearly in the data.</p><h3>Is the game against AI?</h3><p>No. AI saves real money here, and in later levels it gets cheap enough to create value for the whole town. The trap is how fast and how far, and who sets the rules.</p><h3>Why does retraining not fix it?</h3><p>Retraining lowers the damage each AI agent does, so it narrows the gap. It does not change the fact that each company keeps its full saving and feels only part of the cost. In the model, the levy closes the gap; retraining is the best use of the levy money.</p><h3>Why can\'t companies just agree?</h3><p>They can try. Promises in Level 2 are not binding, and the model shows pacts hold only if nearly everyone joins and they are enforced. Level 4 lets the room test that.</p>'
};
function guideModal() {
  var tabs = [['run', 'Run sheet'], ['levels', 'Level by level'], ['facts', 'Research and numbers'], ['faq', 'Questions from the room']];
  return '<div class="kicker">Facilitator guide</div><h1>Running The Oasis Dilemma</h1><div class="tabs">' + tabs.map(function (t) { return '<button data-a="gtab" data-k="' + t[0] + '" class="' + (S.guideTab === t[0] ? 'on' : '') + '">' + t[1] + '</button>'; }).join('') + '</div><div class="guide">' + GUIDE[S.guideTab] + '</div><div class="actions"><button class="btn primary" data-a="close">Close</button></div>';
}

/* ---------- print kit ---------- */
var ROLES = {
  'CEO': ['You make the final call. Your board rewards company value. Hear all four officers before you vote. Every other CEO in the room got this same briefing.',
          'Rivals will talk to you before each vote. Promises are not binding. Nobody will tell you when this level ends.',
          'You now shape your whole workforce. Which roles should AI do, which should people do with AI, and where could people create new customers?',
          'You lead a company and you live in Oasis City. If the town falls below the floor, every company\'s value is cut, including yours.'],
  'CFO': ['One AI agent costs 4 coins and replaces a 10 coin wage. That is a 6 coin saving every round, and all of it is yours.',
          'AI costs fall each round. Integration cost grows with the square of how many agents you add at once: 2 agents cost 2, 4 cost 8, 10 cost 50. New agents run at half output in their first round.',
          'Augmented roles cost 12 a round (wage plus copilot) and bring about 6 in extra service revenue. New Venture roles cost 8 once to reskill, earn nothing in the first round, then grow to about 18 a round. Company value counts venture revenue three times.',
          'The levy is charged per AI agent per round. Rebates come back to companies. Retraining and household support go to the town.'],
  'CHRO': ['Every person you replace stops earning and stops shopping. Households spend 8 of every 10 coins in town, and that spending is shared across all companies.',
           'Bringing a person back from AI costs 4 coins in hiring and onboarding.',
           'Augmented people keep earning and spending, and they build trust. People in a New Venture stay employed while they build new demand. Big automation moves in one round make headlines.',
           'Retraining money re-employs displaced people at about 25 coins each, and their wages flow back into the town.'],
  'Chief AI Officer': ['In this level the AI agent does the job as well as a person. The question is not whether it works.',
                       'AI improves every round: output per agent rises from 1.3 to about 1.8 times a person. So-so AI is cheap to install and works at once, but saves only 3 coins and produces less.',
                       'AI is jagged: brilliant at some tasks, weak at others that look similar. Above about 40% AI in your workforce, the chance of a costly AI failure rises. Augmented roles keep a person in the loop.',
                       'AI gets cheaper again this level. When AI saves more than the town loses, automation helps everyone. Know that number.'],
  'Chief Customer Officer': ['Visitors bring 60 coins per company each round. Everything else comes from local households.',
                             'Value pricing wins more customers but gives up 10% margin. Premium earns 8% more per sale but wins fewer customers.',
                             'Trust now moves market share. A zero payroll AI rival is entering the market for the same customers.',
                             'Customers watch who signs the Town Charter. Joining builds trust. Leaving costs more than never joining.']
};
function kitModal() {
  var tabs = [['roles', 'Role cards'], ['cards', 'Decision cards']];
  var h = '<div class="no-print"><div class="kicker">Print kit</div><h1>Materials for the room</h1><div class="tabs">' + tabs.map(function (t) { return '<button data-a="ktab" data-k="' + t[0] + '" class="' + (S.kitTab === t[0] ? 'on' : '') + '">' + t[1] + '</button>'; }).join('') + '</div><p class="small">Press Print to print the role cards or decision cards. Print one set per table.</p><div class="actions"><button class="btn small primary" data-a="print">Print</button><button class="btn small ghost" data-a="close">Close</button></div></div>';
  h += '<div class="kit">';
  if (S.kitTab === 'roles') {
    [1, 2, 3, 4].forEach(function (L) {
      Object.keys(ROLES).forEach(function (r) {
        h += '<div class="rcard"><div class="lv">Level ' + L + ' &middot; ' + esc(E.LEVELS[L].name) + '</div><div class="role">' + esc(r) + '</div><p>' + esc(C(ROLES[r][L - 1])) + '</p><div class="small">The Oasis Dilemma &middot; Knowledge Group</div></div>';
      });
    });
  } else {
    [1, 2, 3, 4].forEach(function (L) {
      var f = { 1: ['AI agents (0 to 10)'], 2: ['AI agents', 'So-so AI', 'Price: Value / Standard / Premium', 'Promise we made (optional)'], 3: ['AI agents', 'So-so AI', 'Augmented roles', 'New Venture roles (max 4)', 'Price: Value / Standard / Premium'], 4: ['AI agents', 'So-so AI', 'Augmented roles', 'New Venture roles (max 4)', 'Price: Value / Standard / Premium', 'Sign the Town Charter: Yes / No'] }[L];
      h += '<div class="rcard"><div class="lv">Decision card &middot; Level ' + L + '</div><div class="role">' + esc(E.LEVELS[L].name) + '</div><p>Company: ______________________</p><p>Round: ______</p>' + f.map(function (x) { return '<p style="margin:10px 0 2px">' + esc(x) + '</p><div class="line"></div>'; }).join('') + '<p style="margin-top:12px">CEO signature: ________________</p></div>';
    });
  }
  h += '</div>';
  return h;
}

/* ---------- final ---------- */
function renderFinal() {
  var g = S.game, sc = E.finalScores(g), last = E.lastRoundEntry(g), fl = g.settings.floor, tpi = last ? last.town.tpi : 100;
  var h = '<div class="wrap"><div class="hero"><div style="color:#F4B223;font-weight:700;letter-spacing:1px;font-size:13px">FINAL RESULTS</div><h1>The <b>Oasis</b> Dilemma</h1><p>' + (tpi < fl ? 'Oasis City ended at ' + fmt(tpi) + ', below the floor of ' + fl + '. Every company\'s value was cut to ' + pct(sc[0] ? sc[0].mult : 1) + '. The market was won, and the town was lost.' : 'Oasis City ended at ' + fmt(tpi) + ', above the floor of ' + fl + '. The water kept flowing, and company value counts in full.') + '</p></div>';
  h += '<div class="card"><h2>Podium</h2><div class="podium">';
  var order = [1, 0, 2];
  order.forEach(function (i) { var s = sc[i]; if (!s) return; h += '<div class="pod p' + (i + 1) + '"><div class="small">' + ['1st', '2nd', '3rd'][i] + '</div><div class="n">' + esc(s.name) + '</div><div class="v">' + fmt(s.finalValue) + '</div>' + (s.mult < 1 ? '<div class="small">before the floor: ' + fmt(s.value) + '</div>' : '') + '</div>'; });
  h += '</div><table class="lb"><tr><th>#</th><th>Company</th><th>Value</th><th>Town floor</th><th>Final value</th></tr>' + sc.map(function (s, i) { return '<tr><td>' + (i + 1) + '</td><td>' + esc(s.name) + '</td><td>' + fmt(s.value) + '</td><td>' + (s.mult < 1 ? '&times; ' + fmt(s.mult, 2) : 'no cut') + '</td><td><b>' + fmt(s.finalValue) + '</b></td></tr>'; }).join('') + '</table></div>';
  h += '<div class="grid"><div class="card"><h2>The town over time</h2>' + lineChart([
    { name: 'Household income', color: '#2b9fc4', values: townSeries(g, 'householdIncome') },
    { name: 'Town Prosperity', color: '#006580', values: townSeries(g, 'tpi') }], { labels: roundLabels(g, true), legend: true, floor: fl }) + '</div>';
  h += '<div class="card"><h2>Company value over time</h2>' + lineChart(firmSeries(g, 'value'), { labels: roundLabels(g), legend: true }) + '</div></div>';
  h += '<div class="card"><h2>Close the session</h2><ol><li>Which single decision changed your result the most?</li><li>Where does your organization create a cost that lands on someone else\'s "town"?</li><li>Write one automation decision you will revisit on Monday, and who you will talk to about it.</li></ol><div class="insight">Win the market. Keep the water flowing.</div><div class="actions"><button class="btn ghost" data-a="backplay">Back to the town</button><button class="btn ghost" data-a="copysummary">Copy results summary</button><button class="btn primary" data-a="tosetup">New session</button></div></div></div>';
  return h;
}

function summaryText() {
  var g = S.game, sc = E.finalScores(g), last = E.lastRoundEntry(g);
  var lines = ['The Oasis Dilemma: results summary', 'Town Prosperity: ' + (last ? fmt(last.town.tpi) : 100) + ' (floor ' + g.settings.floor + ')', 'Household income: ' + (last ? fmt(last.town.householdIncome) : g.N0 * 100) + ' of ' + g.N0 * 100 + ' at the start', ''];
  sc.forEach(function (s, i) { lines.push((i + 1) + '. ' + s.name + ': final value ' + fmt(s.finalValue) + (s.mult < 1 ? ' (before the floor ' + fmt(s.value) + ')' : '')); });
  return lines.join('\n');
}

/* ---------- actions ---------- */
function pushUndo() { S.undo.push(JSON.stringify({ game: S.game, dec: S.dec, view: S.view })); if (S.undo.length > 25) S.undo.shift(); }
function copy(text, ok) { try { navigator.clipboard.writeText(text).then(function () { toast(ok); }, function () { toast('Copy was blocked. Select and copy manually.'); }); } catch (e) { toast('Copy was blocked.'); } }

function act(a, el) {
  var g = S.game;
  switch (a) {
    case 'bgclose': return;
    case 'close': close(); render(); return;
    case 'resume': S.view = 'play'; render(); return;
    case 'start':
      S.game = E.newGame({ teams: S.setup.teams, names: S.setup.names.slice(0, S.setup.teams), edition: S.setup.edition, councilMode: S.setup.councilMode, floor: S.setup.floor, currency: S.setup.currency, seed: Date.now() % 100000000 });
      S.game.settings.modules = JSON.parse(JSON.stringify(S.setup.modules));
      S.undo = []; S.view = 'play'; initDecisions(); render(); open({ type: 'intro' }); return;
    case 'dec':
      var f = g.firms[+el.dataset.f], d = S.dec[f.id], k = el.dataset.k, delta = +el.dataset.d;
      var nv = d[k] + delta; if (nv < 0) return;
      if (k === 'venture' && nv > Math.floor(f.L * 0.4)) return;
      if (delta > 0 && used(d) + 1 > f.L) return;
      d[k] = nv; render(); return;
    case 'price': S.dec[+el.dataset.f].price = el.dataset.p; render(); return;
    case 'charter': S.dec[+el.dataset.f].charter = el.checked; save(); return;
    case 'lock': S.dec[+el.dataset.f].locked = true; render(); return;
    case 'unlock': S.dec[+el.dataset.f].locked = false; render(); return;
    case 'lockall': E.activeFirms(g).forEach(function (f) { S.dec[f.id].locked = true; }); render(); return;
    case 'reveal':
      pushUndo();
      var decs = {}; E.activeFirms(g).forEach(function (f) { decs[f.id] = S.dec[f.id]; });
      S.game = E.playRound(g, decs, g.pendingEvent);
      initDecisions(); render(); open({ type: 'reveal' }); return;
    case 'event':
      var R = Math.floor((g.seed + g.log.length * 31 + Math.floor(Math.random() * 1000)) % E.EVENTS.length);
      g.pendingEvent = E.EVENTS[R].id; render(); open({ type: 'event', id: g.pendingEvent }); return;
    case 'redraw':
      var cur2 = g.pendingEvent, pick; do { pick = E.EVENTS[Math.floor(Math.random() * E.EVENTS.length)].id; } while (pick === cur2);
      g.pendingEvent = pick; render(); open({ type: 'event', id: pick }); return;
    case 'pickevent': g.pendingEvent = el.dataset.id; render(); open({ type: 'event', id: el.dataset.id }); return;
    case 'noevent': g.pendingEvent = null; close(); render(); return;
    case 'intro': open({ type: 'intro' }); return;
    case 'debrief': open({ type: 'debrief' }); return;
    case 'extraround': S.endNow = null; extraRound(); return;
    case 'endnow': S.endNow = g.level; render(); return;
    case 'nextlevel': pushUndo(); S.game = E.nextLevel(g); S.allowExtra = null; S.endNow = null; initDecisions(); close(); render(); open({ type: 'intro' }); return;
    case 'final': close(); S.view = 'final'; render(); window.scrollTo(0, 0); return;
    case 'backplay': S.view = 'play'; render(); return;
    case 'undo': if (!S.undo.length) return; var u = JSON.parse(S.undo.pop()); S.game = u.game; S.dec = u.dec; S.view = u.view; close(); render(); toast('Undone'); return;
    case 'settings': open({ type: 'settings' }); return;
    case 'guide': open({ type: 'guide' }); return;
    case 'kit': open({ type: 'kit' }); return;
    case 'gtab': S.guideTab = el.dataset.k; renderModal(); return;
    case 'ktab': S.kitTab = el.dataset.k; renderModal(); return;
    case 'print': try { window.print(); } catch (e) { toast('Printing is blocked here. Use the PDF kit.'); } return;
    case 'chart': S.chart = el.dataset.k; render(); return;
    case 'hidehints': g.settings.hints = false; render(); return;
    case 'merge': open({ type: 'merge' }); return;
    case 'domerge':
      var A = +$('mA').value, B = +$('mB').value; if (A === B) { toast('Pick two different companies.'); return; }
      pushUndo(); S.game = E.mergeFirms(g, A, B); initDecisions(); close(); render(); toast('Merged. Review fee and trust cost applied.'); return;
    case 'copystate': copy(JSON.stringify({ game: S.game, dec: S.dec, view: S.view }), 'Session copied'); return;
    case 'copysummary': copy(summaryText(), 'Summary copied'); return;
    case 'loadstate': try { var x = JSON.parse($('statebox').value); if (!x.game || !x.game.firms) throw 0; S.game = x.game; S.dec = x.dec || {}; S.view = x.view || 'play'; if (!Object.keys(S.dec).length) initDecisions(); close(); render(); toast('Session restored'); } catch (e) { toast('That does not look like a saved session.'); } return;
    case 'tosetup': close(); S.view = 'setup'; render(); return;
    case 'nologo': S.logo = null; render(); renderModal(); return;
  }
}
function extraRound() {
  // allow one more round in levels with maxRounds
  var g = S.game, c = cfg();
  if (!c.maxRounds || g.round >= c.maxRounds) return;
  S.allowExtra = g.level + ':' + (g.round + 1);
  render();
}

// roundComplete honours an extra round request
roundComplete = function () { var g = S.game, c = cfg(); if (S.endNow === g.level && g.round >= 1) return true; if (S.allowExtra === g.level + ':' + (g.round + 1) && c.maxRounds && g.round < c.maxRounds) return false; return g.round >= c.rounds; };

document.addEventListener('click', function (e) {
  var stop = e.target.closest('[data-stop]');
  var t = e.target.closest('[data-a]');
  if (!t) return;
  if (t.dataset.a === 'bgclose' && !stop) { if (S.modal && S.modal.type !== 'confirm') { close(); render(); } return; }
  if (t.dataset.a === 'bgclose') return;
  if (t.tagName === 'INPUT' && t.type === 'file') return;
  act(t.dataset.a, t);
});
document.addEventListener('change', function (e) {
  var el = e.target;
  if (el.dataset.s) { var v = el.value; if (el.dataset.s === 'teams' || el.dataset.s === 'floor') v = +v; S.setup[el.dataset.s] = v; render(); return; }
  if (el.dataset.m) { S.setup.modules[el.dataset.m] = el.checked; save(); return; }
  if (el.dataset.name != null) { S.setup.names[+el.dataset.name] = el.value; save(); return; }
  if (el.dataset.rename != null) { S.game.firms[+el.dataset.rename].name = el.value || ('Team ' + (+el.dataset.rename + 1)); render(); renderModal(); return; }
  if (el.dataset.g) { var gv = el.type === 'checkbox' ? el.checked : el.value; if (el.dataset.g === 'floor') gv = +gv; S.game.settings[el.dataset.g] = gv; render(); renderModal(); return; }
  if (el.dataset.gm) { S.game.settings.modules[el.dataset.gm] = el.checked; render(); renderModal(); return; }
  if (el.dataset.c) { var k = el.dataset.c, val = el.type === 'checkbox' ? el.checked : +el.value; S.game.council[k] = val; if (k === 'retrain' && S.game.council.retrain + S.game.council.support > 100) S.game.council.support = 100 - S.game.council.retrain; if (k === 'support' && S.game.council.retrain + S.game.council.support > 100) S.game.council.retrain = 100 - S.game.council.support; S.game.council.rebate = Math.max(0, 100 - S.game.council.retrain - S.game.council.support); render(); return; }
  if (el.dataset.a === 'logo' && el.files && el.files[0]) { var rd = new FileReader(); rd.onload = function () { S.logo = rd.result; render(); renderModal(); toast('Logo added'); }; rd.readAsDataURL(el.files[0]); return; }
});
document.addEventListener('input', function (e) {
  var el = e.target;
  if (el.type === 'range' && el.nextElementSibling && el.nextElementSibling.tagName === 'B') {
    var v = +el.value; el.nextElementSibling.textContent = el.dataset.c === 'levy' ? v.toFixed(1) : (el.dataset.c === 'retrain' || el.dataset.c === 'support' || el.dataset.c === 'charterCap' ? v + '%' : v);
  }
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.modal) { close(); render(); } });

load();
if (S.game && S.view !== 'setup' && !Object.keys(S.dec).length) initDecisions();
render();
})();

</script>
</body>
</html>
